[package]
name = "shoestring-terminal"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/anukin/shoestring"

[dependencies]
base64 = "0.22"
libc = "0.2"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
