name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/support.md and docs/limitations.md first; many gaps are known and tracked there.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Mention anything it should never do (for example, widen what workers may access).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
